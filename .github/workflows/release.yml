name: release

# Publishes a GitHub release when a v* tag is pushed
# (specs/release-v0.1/SPEC.md R5; the procedure is docs/releasing.md).
# Nothing is created until every check passes; the release is created as a
# draft with all its assets and only then made public.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets
  actions: read # find the ci workflow's run for the tagged commit

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the tag and the changelog
        run: scripts/release-check.sh "$TAG" "$RUNNER_TEMP/notes.md"

      - name: Require the tagged commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Require a successful ci run of the tagged commit
        run: |
          n="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq length)"
          if [ "$n" -eq 0 ]; then echo "::error::no successful ci run on a push of $GITHUB_SHA; push main, wait for ci, then push the tag again"; exit 1; fi

      - name: Check reproducibility
        run: scripts/check-reproducible.sh "$TAG"

      - name: Build the release archives
        run: scripts/release.sh "$TAG"

      - name: Check the built version
        run: |
          d="$RUNNER_TEMP/unpack"
          mkdir -p "$d"
          tar -xzf "dist/kern-$TAG-linux-amd64.tar.gz" -C "$d"
          got="$("$d/kern-$TAG-linux-amd64/kern" version --human)"
          echo "$got"
          case "$got" in "kern $TAG ("*) ;; *) echo "::error::the binary reports '$got', not $TAG"; exit 1 ;; esac

      - name: Create the draft release
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086 # pre is one flag or nothing
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --draft --verify-tag $pre --title "kern $TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
